{% extends 'base.html' %}
{% block content %}
<h1 class="mb-3">{{ 'Edit student' if editing else 'Add student' }}</h1>
<form method="post" class="panel" style="max-width:720px">
  <div class="row g-3">
    <div class="col-md-4"><label class="form-label">Roll number</label><input class="form-control" name="roll_no" value="{{ s.roll_no }}" required></div>
    <div class="col-md-8"><label class="form-label">Full name</label><input class="form-control" name="name" value="{{ s.name }}" required></div>
    <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ s.email or '' }}"></div>
    <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ s.phone or '' }}"></div>
    <div class="col-md-8"><label class="form-label">Department</label><input class="form-control" name="department" value="{{ s.department or '' }}"></div>
    <div class="col-md-4"><label class="form-label">Year of study</label>
      <select class="form-select" name="year_of_study">{% for y in [1,2,3,4] %}<option {{ 'selected' if s.year_of_study==y }}>{{ y }}</option>{% endfor %}</select></div>
  </div>
  <div class="mt-4"><button class="btn btn-ink">Save student</button>
    <a class="btn btn-link" href="{{ url_for('students') }}">Cancel</a></div>
</form>
{% endblock %}
