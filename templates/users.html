{% extends 'base.html' %}
{% block content %}
<h1 class="mb-3">Users</h1>
<div class="row">
  <div class="col-lg-7"><div class="panel"><table class="table align-middle"><tr><th>Username</th><th>Role</th><th></th></tr>
    {% for u in users %}<tr><td>{{ u.username }}</td><td>{{ u.role }}</td><td>
      {% if u.username != session.user %}<form method="post" action="{{ url_for('delete_user', uid=u.id) }}" onsubmit="return confirm('Remove this user?')"><button class="btn btn-sm btn-link text-danger p-0">Remove</button></form>{% endif %}</td></tr>{% endfor %}</table></div></div>
  <div class="col-lg-5"><form method="post" class="panel"><h2>Add a teacher or admin</h2>
    <label class="form-label">Username</label><input class="form-control mb-3" name="username" required>
    <label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" minlength="6" required>
    <label class="form-label">Role</label><select class="form-select mb-3" name="role"><option value="teacher">Teacher</option><option value="admin">Admin</option></select>
    <button class="btn btn-ink">Create user</button></form></div>
</div>
{% endblock %}
